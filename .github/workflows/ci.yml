name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, unit tests, build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: Rust tests and app build (${{ matrix.name }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: npm ci
      - run: npm run build
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Native Takumi PDF test
        run: cargo test -p calmmd-core renders_a_simple_pdf
      # Paged.js fallback: real pagination via headless Chromium over CDP. GitHub runners ship Chrome or Edge.
      - name: PDF pagination fallback test
        run: cargo test --manifest-path src-tauri/Cargo.toml prints_paginated_pdf -- --include-ignored
      - name: Build the app (no installers)
        run: npx tauri build --no-bundle
