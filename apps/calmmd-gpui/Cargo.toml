[package]
name = "calmmd-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CalmMD GPUI Kit desktop shell"
default-run = "calmmd-gpui"

[dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
calmmd-core = { path = "../../crates/calmmd-core" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
rfd = "0.15"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
