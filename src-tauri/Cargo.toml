[package]
name = "calmmd"
version = "1.1.0"
description = "CalmMD: a calm, beautiful Markdown editor"
authors = ["CalmMD contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
name = "calmmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calmmd-core = { path = "../crates/calmmd-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
rmcp = { version = "=3.11.0", features = ["transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1.0"
trash = "5"
base64 = "0.22"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
mordant = { version = "0.10.1", features = ["meta", "footnotes", "highlighter", "math"] }
zspell = { version = "0.5.5", features = ["unstable-suggestions"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
takumi-core = { version = "0.36", features = ["html"] }
takumi-pdf = "0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
